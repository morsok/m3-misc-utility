[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3-misc-utility"
version = "0.1.0"
description = "CLI utilities for Mylar3 comic management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "filelock>=3.16",
]

[project.scripts]
m3 = "m3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m3"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1",
    "types-requests>=2.32",
    "pymarkdownlnt>=0.9.36",
    "pytest>=9.0.3",
    "requests-mock>=1.12.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"  # py314 not yet a valid ruff target; 3.14 features still apply

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"src/m3/commands/*.py" = ["ANN"]
"src/m3/cli.py" = ["ANN"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
